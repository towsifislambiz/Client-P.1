<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="meshBlue" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshCyan" cx="75%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    
    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="900" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="350" fill="url(#meshBlue)" />
  <circle cx="650" cy="650" r="320" fill="url(#meshCyan)" />
  <circle cx="400" cy="500" r="280" fill="url(#goldGlow)" />

  <!-- Outer Glowing Border -->
  <rect x="12" y="12" width="776" height="876" rx="36" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Geometric Tech Grid Overlay -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="540" x2="800" y2="540" />
    <line x1="0" y1="720" x2="800" y2="720" />
    <line x1="160" y1="0" x2="160" y2="900" />
    <line x1="320" y1="0" x2="320" y2="900" />
    <line x1="480" y1="0" x2="480" y2="900" />
    <line x1="640" y1="0" x2="640" y2="900" />
  </g>

  <!-- Brand Logo & Header -->
  <g transform="translate(60, 50)">
    <!-- Tech Dot Symbol -->
    <rect x="0" y="4" width="40" height="40" rx="12" fill="#2563eb" />
    <circle cx="20" cy="24" r="8" fill="#38bdf8" />
    <!-- Brand Title -->
    <text x="52" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="1">LINK BD</text>
    <text x="180" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="2">BROADBAND</text>
    
    <!-- Live Status Pill -->
    <rect x="520" y="8" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="538" cy="24" r="5" fill="#10b981" />
    <text x="552" y="29" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="700" fill="#34d399">অফার সক্রিয় আছে</text>
  </g>

  <!-- Special Offer Top Tag -->
  <g transform="translate(400, 145)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="url(#badgeGrad)" filter="url(#shadow)" />
    <text x="0" y="6" font-family="'Hind Siliguri', sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">⚡ মেগা স্পেশাল ধামাকা অফার</text>
  </g>

  <!-- Main Punchy Title -->
  <g transform="translate(400, 225)" text-anchor="middle">
    <text x="0" y="0" font-family="'Hind Siliguri', sans-serif" font-size="38" font-weight="900" fill="#ffffff">নতুন অপটিক্যাল ফাইবার সংযোগে</text>
    <text x="0" y="55" font-family="'Hind Siliguri', sans-serif" font-size="44" font-weight="900" fill="#38bdf8">ফ্রি ডুয়াল-ব্যান্ড গিগাবিট রাউটার!</text>
  </g>

  <!-- Subtitle -->
  <text x="400" y="325" text-anchor="middle" font-family="'Hind Siliguri', sans-serif" font-size="17" font-weight="500" fill="#94a3b8">
    সাথে পাচ্ছেন প্রথম মাসের বিলে বিশেষ ক্যাশব্যাক এবং সম্পূর্ণ ফ্রি ইনস্টলেশন
  </text>

  <!-- Central Graphic: Router & High Speed Showcase -->
  <g transform="translate(400, 500)" filter="url(#shadow)">
    <!-- Glowing Base Pedestal -->
    <ellipse cx="0" cy="110" rx="280" ry="40" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
    <ellipse cx="0" cy="110" rx="220" ry="25" fill="#0f172a" stroke="#0284c7" stroke-width="2" />

    <!-- Stylized Modern Router Body -->
    <path d="M-140,80 L140,80 L160,110 L-160,110 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect x="-130" y="70" width="260" height="25" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <!-- Router LED Indicators -->
    <circle cx="-90" cy="82" r="3.5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="-65" cy="82" r="3.5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="-40" cy="82" r="3.5" fill="#10b981" filter="url(#glow)" />
    <circle cx="-15" cy="82" r="3.5" fill="#10b981" filter="url(#glow)" />
    <circle cx="10" cy="82" r="3.5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="35" cy="82" r="3.5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="60" cy="82" r="3.5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="85" cy="82" r="3.5" fill="#10b981" filter="url(#glow)" />

    <!-- 4 Gigabit High-Gain Antennas -->
    <!-- Antenna 1 -->
    <line x1="-120" y1="70" x2="-160" y2="-70" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" />
    <line x1="-120" y1="70" x2="-160" y2="-70" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <!-- Antenna 2 -->
    <line x1="-40" y1="70" x2="-50" y2="-90" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" />
    <line x1="-40" y1="70" x2="-50" y2="-90" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <!-- Antenna 3 -->
    <line x1="40" y1="70" x2="50" y2="-90" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" />
    <line x1="40" y1="70" x2="50" y2="-90" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <!-- Antenna 4 -->
    <line x1="120" y1="70" x2="160" y2="-70" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" />
    <line x1="120" y1="70" x2="160" y2="-70" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />

    <!-- Wi-Fi Wave Signals -->
    <path d="M-60,-115 A80,80 0 0,1 60,-115" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <path d="M-90,-140 A120,120 0 0,1 90,-140" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <path d="M-120,-165 A160,160 0 0,1 120,-165" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.3" />

    <!-- Feature Badges Float -->
    <g transform="translate(-230, -20)">
      <rect x="0" y="0" width="130" height="56" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="65" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#38bdf8">10 Gbps</text>
      <text x="65" y="44" text-anchor="middle" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">BDIX স্পিড</text>
    </g>

    <g transform="translate(100, -20)">
      <rect x="0" y="0" width="130" height="56" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="65" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#34d399">100%</text>
      <text x="65" y="44" text-anchor="middle" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">বাফারলেস 4K</text>
    </g>
  </g>

  <!-- 3 Highlights List Pills -->
  <g transform="translate(400, 675)" text-anchor="middle">
    <!-- Pill 1 -->
    <rect x="-310" y="-18" width="195" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="-212" y="6" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">✓ শূন্য লেটেন্সি গেমিং</text>

    <!-- Pill 2 -->
    <rect x="-97" y="-18" width="195" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="0" y="6" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">✓ ফ্রি লাইভ টিভি পোর্টাল</text>

    <!-- Pill 3 -->
    <rect x="115" y="-18" width="195" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="212" y="6" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">✓ ২৪/৭ অপটিক্যাল সাপোর্ট</text>
  </g>

  <!-- Call-to-Action Big Button -->
  <g transform="translate(400, 755)" filter="url(#shadow)" cursor="pointer">
    <rect x="-190" y="-28" width="380" height="56" rx="28" fill="url(#btnGrad)" />
    <text x="0" y="8" text-anchor="middle" font-family="'Hind Siliguri', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1">
      অফারটি নিতে এখনই আবেদন করুন →
    </text>
  </g>

  <!-- Footer Contact Numbers -->
  <g transform="translate(400, 840)" text-anchor="middle">
    <text x="0" y="0" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="600" fill="#64748b">
      হটলাইন: <tspan font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#38bdf8">01995-648616</tspan> | <tspan font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#38bdf8">01897-785024</tspan> • <tspan fill="#94a3b8">www.linkbd.net</tspan>
    </text>
    <text x="0" y="24" font-family="'Hind Siliguri', sans-serif" font-size="11" font-weight="500" fill="#475569">
      * শর্ত প্রযোজ্য • নির্দিষ্ট কাভারেজ এরিয়ার জন্য প্রযোজ্য
    </text>
  </g>
</svg>